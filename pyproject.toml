[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gatekeeper"
version = "0.4.0"
description = "Read-only MCP server for ApiGatekeeper instances"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Jason Byteforge", email = "jmazzahacks@users.noreply.github.com" },
]
keywords = ["mcp", "api-gatekeeper", "model-context-protocol"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "api-gatekeeper-api @ git+https://github.com/jmazzahacks/api-gatekeeper-api-python.git",
    "byteforge-loki-logging @ git+https://github.com/jmazzahacks/byteforge-loki-logging.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-gatekeeper = "mcp_gatekeeper.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gatekeeper"]

# Allow `api-gatekeeper-api @ git+https://…` direct reference in dependencies.
# Hatchling rejects these by default (PyPI bans direct refs), but the MCP
# is distributed via Docker/GitHub, not PyPI, so the safety check doesn't apply.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
